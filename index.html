<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- iOS/iPadOS home-screen icon: mobile browsers don't use the plain
         favicon above, so without this the address bar/home screen falls
         back to a generic globe. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#08080A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxeCard: Your introduction, upgraded.</title>
    <meta name="description" content="One tap connects people to your contact, socials, portfolio, business and more." />
    <link rel="canonical" href="https://www.luxecard.co.ke/" />
    <!-- Set before any CSS has a chance to load, so there is never a flash
         of a default white/empty background while index.css is fetched
         and parsed. Same colour as --bg-base in index.css. -->
    <style>
      html, body { background: #08080a; }
    </style>
    <!-- Start the nav logo downloading with the HTML rather than after the JS
         bundle renders the nav, so it is ready when the nav fades in. -->
    <link rel="preload" as="image" href="/images/luxecard-logo.webp" fetchpriority="high" />
    <!-- Only the two fonts the hero heading (Manrope 800) and its body text
         (Inter 400, the default weight) actually use — every other weight
         waits for the normal CSS discovery. These paths are the exact same
         URLs the @font-face rules in index.css resolve to (see there), so
         the browser doesn't fetch the font twice. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="LuxeCard: Your introduction, upgraded." />
    <meta property="og:description" content="One tap connects people to your contact, socials, portfolio, business and more." />
    <meta property="og:url" content="https://www.luxecard.co.ke/" />
    <meta property="og:image" content="https://www.luxecard.co.ke/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.luxecard.co.ke/og-image.png" />
    <meta name="twitter:title" content="LuxeCard: Your introduction, upgraded." />
    <meta name="twitter:description" content="One tap connects people to your contact, socials, portfolio, business and more." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
